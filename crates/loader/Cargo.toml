[package]
name = "scarlett-loader"
description = "Maps a PE32+ image into host memory and prepares it for native execution"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
scarlett-pe.workspace = true
scarlett-hle.workspace = true
log.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
scarlett-pe = { workspace = true, features = ["builder"] }
